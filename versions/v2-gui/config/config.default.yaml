# Blackmagic RAW (BRAW) Automated Converter Configuration

# Storage and Ingest Folder Paths
storage:
  ingest_dir: "./watch_folders/00_IN_INGEST"
  processing_dir: "./watch_folders/01_PROCESSING"
  completed_dir: "./watch_folders/02_COMPLETED_MP4"
  archive_dir: "./watch_folders/03_ARCHIVE_BRAW"
  failed_dir: "./watch_folders/99_FAILED"

# Ingest & Hot Folder Watcher Settings
watcher:
  # Polling interval in seconds (for fallback or supplemental scanning)
  poll_interval: 2.0
  # Minimum consecutive checks with unchanged file size before considered complete
  stability_checks: 3
  # Delay between stability checks in seconds
  stability_delay: 2.0
  # Allowed video extensions (case insensitive)
  extensions:
    - ".braw"
  # Process associated sidecar files (.sidecar) together with the braw clip
  include_sidecars: true

# Transcode Settings
transcode:
  # Output container and codec
  container: "mp4"
  codec: "H265"           # Options: H265, H264
  encoding_profile: "Main10" # Main10 (10-bit HDR/SDR) or Main (8-bit)
  video_quality: "Best"      # Options: Least, Low, Medium, High, Best
  bitrate_mbps: 0            # 0 for automatic based on quality, or specific Mbps (e.g. 80)
  
  # Resolution & Frame Rate
  # 'source' preserves 1:1 original input clip resolution and fps
  resolution: "source"       
  frame_rate: "source"

  # Audio configuration
  audio:
    codec: "aac"
    sample_rate: 48000
    bit_depth: 16
    bitrate_kbps: 320

  # Color Grading & LUT Settings
  color:
    # Mode: 'lut', 'embedded', or 'none'
    mode: "lut"
    # Relative path within DaVinci Resolve LUT directory or absolute path to .cube file
    # Default Blackmagic Gen 5 conversion LUT:
    lut_path: "Blackmagic Design/Blackmagic Gen 5 Film to Extended Video.cube"
    # Fallback LUT if Gen 5 is not found or for older cameras:
    fallback_lut_path: "Blackmagic Design/Blackmagic Film to Extended Video v4.cube"

# DaVinci Resolve Studio Process Management
davinci:
  app_path: "/Applications/DaVinci Resolve/DaVinci Resolve.app/Contents/MacOS/Resolve"
  auto_start_headless: true
  launch_timeout: 45
  project_name_prefix: "BRAW_Transcode_Job"
  cleanup_projects_after_render: true
